<!DOCTYPE html>
<html>

<head>
    <title>Istoric</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <link rel="stylesheet" href="style.css">
    <style>
        #historyScreen {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: #111;
            color: white;
            box-sizing: border-box;
        }
        #tripList { display: flex; flex-direction: column; flex: 1; }
        .tripRow {
            display: flex;
            flex-direction: row;
            align-items: center;
            border-bottom: 1px solid #222;
            padding: 14px 20px;
            cursor: pointer;
            gap: 12px;
        }
        .tripRow:active { background: #222; }
        .tripRowText { display: flex; flex-direction: column; flex: 1; gap: 4px; }
        .tripRowTop { display: flex; justify-content: space-between; align-items: center; }
        .tripName { font-size: 1.2rem; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .routeBadge {
            background: #007bff;
            color: white;
            font-size: 0.85rem;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
            flex-shrink: 0;
        }
        .tripDate { font-size: 1rem; color: #aaa; }
        .tripMeta { font-size: 0.95rem; color: #aaa; display: flex; gap: 20px; }
        .tripMeta span { color: #ccc; }
        .deleteBtn {
            background: transparent;
            border: none;
            color: #555;
            font-size: 1.3rem;
            cursor: pointer;
            padding: 4px;
            flex-shrink: 0;
        }
        .deleteBtn:active { color: #cc0000; }
        #mapView { display: none; flex-direction: column; height: 100vh; background: #111; }
        .mapHeader {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            background: #111;
            color: white;
            border-bottom: 1px solid #333;
            gap: 12px;
            flex-shrink: 0;
        }
        .mapHeader .backBtn {
            font-size: 1.4rem;
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
        }
        .mapTitle { flex: 1; font-size: 1rem; font-weight: bold; }
        .mapStats { font-size: 0.9rem; color: #aaa; text-align: right; }
        .mapBody { display: flex; flex-direction: row; flex: 1; min-height: 0; }
        #tripMap { flex: 1; min-width: 0; }
        #stopLog {
            width: 260px;
            min-width: 260px;
            background: #111;
            color: white;
            overflow-y: auto;
            border-left: 1px solid #333;
            flex-shrink: 0;
        }
        .stopLogHeader {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 10px 12px;
            border-bottom: 1px solid #333;
            font-size: 0.8rem;
            color: #aaa;
            position: sticky;
            top: 0;
            background: #111;
        }
        .stopLogHeaderRow { display: flex; gap: 8px; }
        .stopLogRow {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 10px 12px;
            border-bottom: 1px solid #222;
            font-size: 0.95rem;
        }
        .slName { font-weight: bold; color: white; }
        .slTimes { display: flex; gap: 8px; font-size: 0.85rem; color: #aaa; }
        .slDiff { font-size: 0.9rem; font-weight: bold; }
        .pageHeader { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; font-size: 1.3rem; font-weight: bold; border-bottom: 1px solid #333; }
        #summary { display: flex; gap: 8px; padding: 12px 16px 4px; }
        #summary > div { flex: 1; background: #1a1a1a; border-radius: 8px; padding: 8px; text-align: center; }
        #summary b { display: block; font-size: 1.25rem; }
        #summary span { font-size: .75rem; color: #888; }
        #lineChips { display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto; }
        .chip { background: #222; color: #ccc; border: 1px solid #333; border-radius: 16px; padding: 5px 12px; cursor: pointer; white-space: nowrap; }
        .chip.on { background: #007bff; color: white; border-color: #007bff; }
        .dateHead { padding: 8px 20px; font-size: .85rem; color: #888; background: #181818; position: sticky; top: 0; }
        .tripDelay { font-weight: bold; font-size: 1.1rem; }
        @media (max-width: 700px) {
            .mapBody { flex-direction: column; }
            #tripMap { flex: 0 0 45%; }
            #stopLog { width: auto; min-width: 0; border-left: none; border-top: 1px solid #333; flex: 1; }
        }
        .emptyMsg { padding: 40px 20px; text-align: center; color: #555; font-size: 1.1rem; }
        .loadingMsg { padding: 40px 20px; text-align: center; color: #aaa; font-size: 1.1rem; }
        .noStopsMsg { padding: 20px 12px; text-align: center; color: #555; font-size: 0.9rem; }
    </style>

    <script type="module">
        import { db, ref, get, remove, query, orderByKey, limitToLast, esc } from "./firebase.js";

        let tripMap = null;
        let trackLayer = null;
        let markerLayers = [];

        const TRIP_LIMIT = 200; // trips carry their full GPS track, so only fetch the latest ones
        let allTrips = [], activeLine = null;

        const lineOf = (t) => t.routeId || (t.key ? t.key.split('_')[1] : '');
        function tripStats(t) {
            const real = (t.stops || []).filter(s => !s.skipped && typeof s.diff === 'number');
            const skipped = (t.stops || []).length - real.length;
            const avg = real.length ? real.reduce((a, s) => a + s.diff, 0) / real.length : null;
            const max = real.length ? Math.max(...real.map(s => s.diff)) : null;
            const onTime = real.filter(s => Math.abs(s.diff) <= 1).length;
            return { real, skipped, avg, max, onTime };
        }
        const fmtDelay = (m) => m === null ? '-' : (m > 0 ? '+' : '') + Math.round(m * 10) / 10 + "'";
        const delayColor = (m) => m === null ? '#777' : m > 3 ? '#ff6b6b' : m > 1 ? '#ffb84d' : '#6bff8e';

        async function loadTrips() {
            document.getElementById('tripList').innerHTML = '<div class="loadingMsg">Se incarca...</div>';
            const snapshot = await get(query(ref(db, 'trips'), orderByKey(), limitToLast(TRIP_LIMIT)));
            allTrips = [];
            snapshot.forEach(child => { allTrips.push({ key: child.key, ...child.val() }); });
            allTrips.sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.departureTime || '').localeCompare(a.departureTime || ''));
            renderList();
        }
        window.setLine = (l) => { activeLine = l; renderList(); };

        function renderList() {
            const list = document.getElementById('tripList');
            const lines = [...new Set(allTrips.map(lineOf).filter(Boolean))].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
            document.getElementById('lineChips').innerHTML = lines.length < 2 ? '' :
                [null, ...lines].map(l => `<button class="chip ${l === activeLine ? 'on' : ''}" onclick="setLine(${l === null ? 'null' : `'${esc(l)}'`})">${l === null ? 'Toate' : 'Linia ' + esc(l)}</button>`).join('');

            const trips = activeLine ? allTrips.filter(t => lineOf(t) === activeLine) : allTrips;
            const all = trips.map(tripStats);
            const stopsN = all.reduce((a, s) => a + s.real.length, 0);
            const avg = stopsN ? all.reduce((a, s) => a + s.real.reduce((b, x) => b + x.diff, 0), 0) / stopsN : null;
            const onTimePct = stopsN ? Math.round(100 * all.reduce((a, s) => a + s.onTime, 0) / stopsN) : null;
            document.getElementById('summary').innerHTML = trips.length ? `
                <div><b>${trips.length}</b><span>curse</span></div>
                <div><b>${trips.reduce((a, t) => a + (parseFloat(t.distanceKm) || 0), 0).toFixed(1)}</b><span>km</span></div>
                <div><b style="color:${delayColor(avg)}">${fmtDelay(avg)}</b><span>intarziere medie</span></div>
                <div><b>${onTimePct === null ? '-' : onTimePct + '%'}</b><span>la timp (±1')</span></div>` : '';

            list.innerHTML = '';
            if (!trips.length) { list.innerHTML = '<div class="emptyMsg">Nu exista curse inregistrate.</div>'; return; }
            let lastDate = null;
            trips.forEach((trip, idx) => {
                if (trip.date !== lastDate) {
                    lastDate = trip.date;
                    const h = document.createElement('div'); h.className = 'dateHead'; h.textContent = trip.date || '-'; list.appendChild(h);
                }
                const st = all[idx];
                const row = document.createElement('div');
                row.className = 'tripRow';
                const textDiv = document.createElement('div');
                textDiv.className = 'tripRowText';
                textDiv.innerHTML = `
                    <div class="tripRowTop">
                        <span class="tripName"><span class="routeBadge">${esc(lineOf(trip)) || '?'}</span><span>${esc(trip.routeName) || '-'}</span></span>
                        <span class="tripDelay" style="color:${delayColor(st.avg)}">${fmtDelay(st.avg)}</span>
                    </div>
                    <div class="tripMeta">
                        <span>&#128344; ${esc(trip.startTime) || '-'} – ${esc(trip.endTime) || '-'}</span>
                        <span>&#128205; ${esc(trip.distanceKm) || '0'} km</span>
                        ${st.real.length ? `<span>&#10003; ${st.real.length} statii${st.skipped ? ` <i style="color:#cc8800">(${st.skipped} nedetectate)</i>` : ''}</span>` : `<span style="color:#cc8800">&#9888; fara statii</span>`}
                    </div>`;
                textDiv.onclick = () => showTrip(trip);
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'deleteBtn';
                deleteBtn.textContent = '🗑';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation();
                    if (confirm('Stergi aceasta cursa?')) remove(ref(db, `trips/${trip.key}`)).then(loadTrips);
                };
                row.appendChild(textDiv);
                row.appendChild(deleteBtn);
                list.appendChild(row);
            });
        }

        window.showTrip = function(trip) {
            const routeId = trip.routeId || (trip.key ? trip.key.split('_')[1] : null);
            const routePrefix = routeId ? `Linia ${routeId}: ` : '';

            document.getElementById('historyScreen').style.display = 'none';
            document.getElementById('mapView').style.display = 'flex';
            document.getElementById('mapTitle').textContent = `${routePrefix}${trip.routeName || '-'}`;
            const ts = tripStats(trip);
            document.getElementById('mapStats').textContent = `${trip.date} · ${trip.distanceKm} km · ${trip.startTime} – ${trip.endTime}` + (ts.real.length ? ` · medie ${fmtDelay(ts.avg)} · max ${fmtDelay(ts.max)}` : '');

            if (!tripMap) {
                tripMap = L.map('tripMap').setView([47.132, 24.491], 14);
                L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
                }).addTo(tripMap);
            }

            if (trackLayer) { tripMap.removeLayer(trackLayer); trackLayer = null; }
            markerLayers.forEach(m => tripMap.removeLayer(m));
            markerLayers = [];

            if (trip.track && trip.track.length >= 2) {
                const coords = trip.track.map(p => [p.lat, p.lng]);
                trackLayer = L.polyline(coords, { color: '#007bff', weight: 4, opacity: 0.85 }).addTo(tripMap);
                const startM = L.circleMarker(coords[0], { radius: 8, color: '#00cc44', fillColor: '#00cc44', fillOpacity: 1 })
                    .addTo(tripMap).bindPopup('Plecare: ' + trip.startTime);
                const endM = L.circleMarker(coords[coords.length - 1], { radius: 8, color: '#cc0000', fillColor: '#cc0000', fillOpacity: 1 })
                    .addTo(tripMap).bindPopup('Sosire: ' + trip.endTime);
                markerLayers.push(startM, endM);
                tripMap.fitBounds(trackLayer.getBounds(), { padding: [20, 20] });
            }
            tripMap.invalidateSize();

            const stopLogDiv = document.getElementById('stopLog');
            stopLogDiv.innerHTML = '';
            if (trip.stops && trip.stops.length > 0) {
                const header = document.createElement('div');
                header.className = 'stopLogHeader';
                header.innerHTML = `
                    <div class="stopLogHeaderRow"><span style="flex:1">Statie</span></div>
                    <div class="stopLogHeaderRow" style="color:#666;font-size:0.75rem;"><span style="flex:1">Prog. / Real / Status</span></div>
                `;
                stopLogDiv.appendChild(header);
                trip.stops.forEach(s => {
                    const row = document.createElement('div');
                    row.className = 'stopLogRow';
                    if (s.skipped) {
                        // stop was never detected (GPS gap, stop placed off the road, ...)
                        row.innerHTML = `
                            <span class="slName" style="color:#777">${esc(s.name)}</span>
                            <div class="slTimes">
                                <span>${esc(s.scheduled)}</span>
                                <span>→</span>
                                <span style="color:#777">nedetectata</span>
                            </div>
                        `;
                    } else {
                        const color = s.diff === 0 ? '#ccc' : s.diff > 0 ? '#ff6b6b' : '#6bff8e';
                        const diffText = s.diff === 0 ? 'La timp' : s.diff > 0 ? `+${s.diff}'` : `${s.diff}'`;
                        row.innerHTML = `
                            <span class="slName">${esc(s.name)}</span>
                            <div class="slTimes">
                                <span>${esc(s.scheduled)}</span>
                                <span>→</span>
                                <span>${esc(s.actual)}</span>
                                <span class="slDiff" style="color:${color}">${diffText}</span>
                            </div>
                        `;
                    }
                    stopLogDiv.appendChild(row);
                });
            } else {
                stopLogDiv.innerHTML = '<div class="noStopsMsg">Nu exista date pentru statii.</div>';
            }
        }

        window.backToList = function() {
            document.getElementById('mapView').style.display = 'none';
            document.getElementById('historyScreen').style.display = 'flex';
        }

        window.addEventListener('DOMContentLoaded', loadTrips);
    </script>
</head>

<body>
    <div id="historyScreen">
        <div class="pageHeader"><span>Istoric Curse</span><button class="chip" onclick="loadTrips()">&#8635;</button></div>
        <div id="summary"></div>
        <div id="lineChips"></div>
        <div id="tripList"></div>
    </div>
    <div id="mapView">
        <div class="mapHeader">
            <button class="backBtn" onclick="backToList()">&#8592;</button>
            <div class="mapTitle" id="mapTitle">-</div>
            <div class="mapStats" id="mapStats">-</div>
        </div>
        <div class="mapBody">
            <div id="tripMap"></div>
            <div id="stopLog"></div>
        </div>
    </div>
</body>
</html>
