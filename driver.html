<!DOCTYPE html>
<html>

<head>
    <title>Driver</title>
    <link rel="stylesheet" href="style.css">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, set, push, onDisconnect, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAVvYAjwplQaH82ehNXpfK25W3ORikigvE",
            authDomain: "bike-trackerv7.firebaseapp.com",
            databaseURL: "https://bike-trackerv7-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "bike-trackerv7",
            storageBucket: "bike-trackerv7.firebasestorage.app",
            messagingSenderId: "829142915200",
            appId: "1:829142915200:web:cd37f3234ecb850421ae65"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const busRef = ref(db, 'bus');
        onDisconnect(busRef).set({ active: false });

        // Global State Variables
        let masterData = { stops: [], routes: [], trips: [], departures: [] };
        let watchId = null;
        let timerInterval = null;
        let routeStops = [];
        let currentStopIndex = 0;
        let currentRouteName = '';
        let currentRouteId = '';
        let departureTime = '00:00';
        let wakeLock = null;
        let tripTrack = [];
        let totalDistance = 0;
        let tripStartTime = null;
        let tripDate = null;
        let stopLog = [];
        let currentLateness = '0';

        // New state tracking for dwell/bubble mechanics
        let isAtStop = false;
        let activeStopIndex = null;
        let isIdleStandby = false; // Tracks if driver is on the empty end-of-day standby screen

        function updateHeader() {
            const now = new Date();
            const months = ['ian.', 'feb.', 'mar.', 'apr.', 'mai', 'iun.', 'iul.', 'aug.', 'sep.', 'oct.', 'nov.', 'dec.'];
            const day = now.getDate();
            const month = months[now.getMonth()];
            const hours = now.getHours().toString().padStart(2, '0');
            const mins = now.getMinutes().toString().padStart(2, '0');
            const text = `${day} ${month}, ${hours}:${mins}`;
            const el1 = document.getElementById('headerDate');
            const el2 = document.getElementById('headerDate2');
            if (el1) el1.textContent = text;
            if (el2) el2.textContent = text;
        }
        updateHeader();
        setInterval(updateHeader, 1000);

        window.showRouteList = function () {
            const list = document.getElementById('routeList');
            list.innerHTML = '';

            if (!masterData.routes || masterData.routes.length === 0) {
                list.innerHTML = '<div style="color:white; padding: 20px;">No routes found in Firebase. Add routes using editor.html!</div>';
            } else {
                masterData.routes.forEach(route => {
                    const btn = document.createElement('button');
                    btn.textContent = `Linia ${route.route_id}: ${route.name}`;
                    btn.onclick = () => showDepartures(route.route_id);
                    list.appendChild(btn);
                });
            }

            document.getElementById('screen1').style.display = 'flex';
            document.getElementById('screen2').style.display = 'none';
            document.getElementById('driverScreen').style.display = 'none';
        }

        window.showDepartures = function (routeId) {
            const route = masterData.routes.find(r => r.route_id === routeId);
            if (!route) return;
            const list = document.getElementById('departureList');
            list.innerHTML = '';
            document.getElementById('screen2Title').textContent = `Linia ${route.route_id}: ${route.name}`;

            // Find all trips for this route and their departures
            const routeTrips = masterData.trips.filter(t => t.route_id === routeId);
            let availableDepartures = [];

            routeTrips.forEach(trip => {
                const deps = masterData.departures.filter(d => d.trip_id === trip.trip_id);
                deps.forEach(d => {
                    availableDepartures.push({
                        departureId: d.id,
                        time: d.time,
                        trip: trip
                    });
                });
            });

            availableDepartures.sort((a, b) => a.time.localeCompare(b.time));

            availableDepartures.forEach(dep => {
                const btn = document.createElement('button');
                btn.innerHTML = `<span class="depTime">${dep.time}</span><span class="depLabel">${dep.trip.name}</span>`;
                btn.onclick = () => selectRoute(dep, routeId);
                list.appendChild(btn);
            });

            document.getElementById('screen1').style.display = 'none';
            document.getElementById('screen2').style.display = 'flex';
        }

        window.selectRoute = function (dep, routeId) {
            const trip = dep.trip;
            currentRouteName = `${trip.name} ${dep.time}`;
            currentRouteId = routeId;
            departureTime = dep.time;

            // Build stop list for this trip sequence
            routeStops = (trip.stop_sequence || []).map(seq => {
                const stopObj = masterData.stops.find(s => s.id === seq.stop_id);
                return {
                    name: stopObj ? stopObj.name : 'Unknown Stop',
                    lat: stopObj ? stopObj.lat : 0,
                    lng: stopObj ? stopObj.lng : 0,
                    travelMinutes: seq.travel_minutes_from_start || 0
                };
            });

            tripTrack = [];
            totalDistance = 0;
            tripStartTime = null;
            tripDate = new Date().toISOString().slice(0, 10);
            stopLog = [];

            document.getElementById('screen2').style.display = 'none';
            document.getElementById('driverScreen').style.display = 'flex';
            document.querySelector('.leftPanel').style.display = 'flex';

            currentStopIndex = 0;
            renderStops();
            startTracking();
        }

        function getStopScheduledTime(stop) {
            const [h, m] = departureTime.split(':').map(Number);
            const base = h * 60 + m;
            const travel = stop.travelMinutes || 0;
            const total = base + travel;
            const sh = Math.floor(total / 60) % 24;
            const sm = total % 60;
            return `${sh.toString().padStart(2, '0')}:${sm.toString().padStart(2, '0')}`;
        }

        function renderStops() {
            const list = document.getElementById('stopList');
            list.innerHTML = '';
            const visible = routeStops.slice(currentStopIndex, currentStopIndex + 4);
            visible.forEach((stop, i) => {
                const scheduledTime = getStopScheduledTime(stop);
                const stopName = stop.name;
                const row = document.createElement('div');
                row.className = 'stopRow' + (i === 0 ? ' nextStop' : '');
                row.innerHTML = `
                    <span class="stopIndex">${currentStopIndex + i + 1}.</span>
                    <span class="stopName">${stopName}</span>
                    <span class="stopTime">${scheduledTime}</span>
                `;
                list.appendChild(row);
            });
            document.getElementById('routeNumber').textContent = currentRouteId;
            document.getElementById('latenessDisplay').textContent = currentLateness;
        }

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try { wakeLock = await navigator.wakeLock.request('screen'); }
                catch (err) { console.log('Wake lock failed:', err); }
            }
        }

        function startTracking() {
            if (!navigator.geolocation) return;
            requestWakeLock();
            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    const { latitude, longitude } = position.coords;
                    const timeStr = new Date().toTimeString().slice(0, 8);
                    if (!tripStartTime) tripStartTime = timeStr;
                    if (tripTrack.length > 0) {
                        const prev = tripTrack[tripTrack.length - 1];
                        totalDistance += getDistance([prev.lat, prev.lng], [latitude, longitude]);
                    }
                    tripTrack.push({ lat: latitude, lng: longitude, t: timeStr });
                    checkStop([latitude, longitude]);
                    pushToFirebase(latitude, longitude);
                    renderStops();
                },
                (error) => {
                    console.error(error.message);
                    navigator.geolocation.clearWatch(watchId);
                    watchId = null;
                    setTimeout(() => { if (routeStops.length > 0) startTracking(); }, 3000);
                },
                { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 }
            );
            timerInterval = setInterval(() => renderStops(), 5000);
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    requestWakeLock();
                    if (watchId === null && routeStops.length > 0) startTracking();
                }
            });
        }

        function pushToFirebase(lat, lng) {
            if (isIdleStandby || currentStopIndex >= routeStops.length) return;
            const nextStop = routeStops[currentStopIndex];
            const scheduledTime = getStopScheduledTime(nextStop);

            const now = new Date();
            const currentMins = now.getHours() * 60 + now.getMinutes();
            const [depH, depM] = departureTime.split(':').map(Number);
            const timeUntilDeparture = (depH * 60 + depM) - currentMins;
            const shouldShowLive = timeUntilDeparture <= 5;

            set(busRef, {
                active: shouldShowLive,
                lat, lng,
                routeId: currentRouteId,
                route: currentRouteName,
                nextStop: nextStop.name,
                scheduledTime,
                status: currentLateness
            });
        }

        window.endRoute = function () {
            saveTrip();
            stopAllTracking();
            set(busRef, { active: false });
            routeStops = []; 
            currentStopIndex = 0;
            stopLog = [];
            isAtStop = false;
            activeStopIndex = null;
            isIdleStandby = false;
            
            document.querySelector('.leftPanel').style.display = 'flex';
            document.getElementById('driverScreen').style.display = 'none';
            showRouteList();
        }

        function saveTrip() {
            if (tripTrack.length < 2) return;
            const endTime = new Date().toTimeString().slice(0, 8);
            const tripKey = `${tripDate}_${currentRouteId}_${departureTime.replace(':', '')}`;
            const tripsRef = ref(db, `trips/${tripKey}`);
            set(tripsRef, {
                routeName: currentRouteName,
                routeId: currentRouteId,
                date: tripDate,
                departureTime,
                startTime: tripStartTime,
                endTime,
                distanceKm: (totalDistance / 1000).toFixed(2),
                track: tripTrack,
                stops: stopLog
            });
        }

        function checkStop(latlng) {
            if (isIdleStandby || currentStopIndex >= routeStops.length) return;

            const radiusThreshold = 30; // 30-meter radius threshold

            if (!isAtStop) {
                // Phase 1: Look ahead to check if we are entering any remaining stop (handles diversions & skipping)
                for (let i = currentStopIndex; i < routeStops.length; i++) {
                    const stop = routeStops[i];
                    const distance = getDistance(latlng, [stop.lat, stop.lng]);

                    if (distance <= radiusThreshold) {
                        currentStopIndex = i;
                        activeStopIndex = i;
                        isAtStop = true;

                        // SPECIAL RULE: If this is the very last stop of the route, end immediately on "touch"
                        if (currentStopIndex === routeStops.length - 1) {
                            processStopArrivalAndExit(stop);
                            handleRouteCompletion();
                            return;
                        }

                        console.log(`Arrived at stop: ${stop.name}`);
                        break;
                    }
                }
            } else {
                // Phase 2: The bus was dwelling at a stop, check if it has now LEFT the radius
                const activeStop = routeStops[activeStopIndex];
                const distance = getDistance(latlng, [activeStop.lat, activeStop.lng]);

                if (distance > radiusThreshold) {
                    processStopArrivalAndExit(activeStop);

                    // Reset dwell state and move to next stop
                    isAtStop = false;
                    activeStopIndex = null;
                    currentStopIndex++;

                    if (currentStopIndex >= routeStops.length) {
                        handleRouteCompletion();
                    }
                }
            }
        }

        // Helper function to log times and calculate lateness when leaving a stop
        function processStopArrivalAndExit(stop) {
            const actualTime = new Date().toTimeString().slice(0, 5);
            const scheduledTime = getStopScheduledTime(stop);
            const [sh, sm] = scheduledTime.split(':').map(Number);
            const [ah, am] = actualTime.split(':').map(Number);
            const diffMins = (ah * 60 + am) - (sh * 60 + sm);

            currentLateness = diffMins === 0 ? "0" :
                              diffMins > 0 ? `+${diffMins}'` :
                              `${diffMins}'`;

            stopLog.push({ 
                name: stop.name, 
                scheduled: scheduledTime, 
                actual: actualTime, 
                diff: diffMins 
            });
        }

        // Handles what happens when a trip reaches its final destination
        function handleRouteCompletion() {
            saveTrip();
            stopAllTracking();
            set(busRef, { active: false });

            // Check if there is an upcoming trip today
            const nextDep = findNextScheduledDeparture(currentRouteId, departureTime);

            if (nextDep) {
                // Automatically chain/switch into the next consecutive trip seamlessly
                selectRoute(nextDep, currentRouteId);
            } else {
                // Last run of the day: Enter Idle Standby mode
                enterIdleStandbyScreen();
            }
        }

        // Helper to find the next chronological departure on the same line
        function findNextScheduledDeparture(routeId, currentDepTime) {
            const routeTrips = masterData.trips.filter(t => t.route_id === routeId);
            let availableDepartures = [];

            routeTrips.forEach(trip => {
                const deps = masterData.departures.filter(d => d.trip_id === trip.trip_id);
                deps.forEach(d => {
                    availableDepartures.push({
                        departureId: d.id,
                        time: d.time,
                        trip: trip
                    });
                });
            });

            availableDepartures.sort((a, b) => a.time.localeCompare(b.time));
            const currentIndex = availableDepartures.findIndex(d => d.time === currentDepTime);

            if (currentIndex !== -1 && currentIndex + 1 < availableDepartures.length) {
                return availableDepartures[currentIndex + 1];
            }
            return null;
        }

        // Displays the screen with no route number, lateness, or stops, but keeps functional controls
        function enterIdleStandbyScreen() {
            isIdleStandby = true;
            routeStops = [];
            currentStopIndex = 0;
            stopLog = [];
            isAtStop = false;
            activeStopIndex = null;

            // Clear visual indicators on the driver screen layout
            document.getElementById('routeNumber').textContent = '';
            document.getElementById('latenessDisplay').textContent = '';
            document.getElementById('stopList').innerHTML = '<div style="color:white; padding:20px; text-align:center; font-size:18px;">Program terminat (Ultima cursă)</div>';
            
            // Ensure the screen remains open and active for the driver controls
            document.querySelector('.leftPanel').style.display = 'flex';
            document.getElementById('driverScreen').style.display = 'flex';
            document.getElementById('screen1').style.display = 'none';
            document.getElementById('screen2').style.display = 'none';
        }

        function getDistance([lat1, lng1], [lat2, lng2]) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function stopAllTracking() {
            if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
            if (timerInterval !== null) { clearInterval(timerInterval); timerInterval = null; }
            if (wakeLock !== null) { wakeLock.release(); wakeLock = null; }
        }

        window.endRoute = function () {
            saveTrip();
            stopAllTracking();
            set(busRef, { active: false });
            routeStops = []; currentStopIndex = 0;
            stopLog = [];
            document.querySelector('.leftPanel').style.display = 'flex';
            document.getElementById('driverScreen').style.display = 'none';
            showRouteList();
        }

        window.toggleFullscreen = function () {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }

        window.addEventListener("beforeunload", () => set(busRef, { active: false }));

        // LOAD DATA FROM FIREBASE AT STARTUP
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const snapshot = await get(ref(db, 'master_transit_data'));
                if (snapshot.exists()) {
                    masterData = snapshot.val();
                    masterData.stops = masterData.stops || [];
                    masterData.routes = masterData.routes || [];
                    masterData.trips = masterData.trips || [];
                    masterData.departures = masterData.departures || [];
                }
                showRouteList();
            } catch (e) {
                console.error("Failed to load cloud data:", e);
                document.getElementById('routeList').innerHTML = '<div style="color:white; padding:20px;">Failed to load data from Firebase.</div>';
            }
        });
    </script>
</head>

<body>
    <div id="screen1" class="driverRouteScreen">
        <div class="driverHeader">
            <div class="headerDate" id="headerDate">--</div>
            <div class="headerStatus">✓ 3G &nbsp; ✓ GPS 1/1</div>
        </div>
        <div id="routeList" class="selectionList"></div>
    </div>
    <div id="screen2" class="driverRouteScreen" style="display:none;">
        <div class="driverHeader">
            <button class="backBtn" onclick="showRouteList()">&#8592;</button>
            <div class="headerDate" id="screen2Title">--</div>
            <div class="headerStatus">✓ 3G &nbsp; ✓ GPS 1/1</div>
        </div>
        <div id="departureList" class="selectionList"></div>
    </div>
    <div id="driverScreen" class="driverDisplay" style="display:none;">
        <div class="driverHeader">
            <div class="headerDate" id="headerDate2">--</div>
            <div class="headerStatus">✓ 3G &nbsp; ✓ GPS 1/1</div>
        </div>
        <div class="driverTop">
            <div class="leftPanel">
                <div class="routeBox">
                    <div id="routeNumber">-</div>
                </div>
                <div id="latenessDisplay" class="latenessDisplay"></div>
            </div>
            <div id="stopList" class="stopList"></div>
        </div>
        <div class="driverBottom">
            <button class="endRouteBtn" onclick="endRoute()">&#9632;</button>
            <button class="fullscreenBtn" onclick="toggleFullscreen()">&#x26F6;</button>
            <div class="plateBox">BN 29 TCB</div>
        </div>
    </div>
</body>

</html>
