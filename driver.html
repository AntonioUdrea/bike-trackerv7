<!DOCTYPE html>
<html>

<head>
    <title>Driver</title>
    <link rel="stylesheet" href="style.css">
    <script type="module">
        import { db, ref, set, update, onDisconnect, loadMasterData } from "./firebase.js";
        const busRef = ref(db, 'bus');
        onDisconnect(busRef).set({ active: false });

        // Global State Variables
        let masterData = { stops: [], routes: [], trips: [], departures: [] };
        let watchId = null;
        let timerInterval = null;
        let routeStops = [];
        let currentStopIndex = 0;
        let currentRouteName = '';
        let currentRouteId = '';
        let departureTime = '00:00';
        let wakeLock = null;
        let tripTrack = [];
        let totalDistance = 0;
        let tripStartTime = null;
        let tripDate = null;
        let stopLog = [];
        let tripKey = null;          // Firebase key of the trip being driven (null = nothing to save)
        let tripFinished = true;     // true while no trip is running; blocks late GPS callbacks / double saves
        let tripWrittenOnce = false; // first save uses set(), later saves use update()
        let lastFix = null;          // previous raw GPS fix, used for stop detection between fixes
        let currentLateness = '0';
        let currentDepId = null;
        let currentTripId = null;
        let currentDelayMin = 0;
        let visibilityListenerAdded = false;

        // Tunables
        const STOP_RADIUS_M = 30;        // how close counts as "at the stop"
        const LOOKAHEAD_STOPS = 5;       // how many stops ahead we accept as the next stop reached
        const MAX_ACCURACY_M = 100;      // ignore GPS fixes worse than this
        const MIN_TRACK_STEP_M = 8;      // don't store track points closer than this (kills jitter while stopped)
        const AUTOSAVE_MS = 120000;      // periodic save while driving, so a crash loses at most ~2 min
        let settings = {
                nightStart: "20:30",
                dayStart: "06:30"
            };

        // New state tracking for dwell/bubble mechanics
        let isAtStop = false;
        let activeStopIndex = null;
        let isIdleStandby = false; // Tracks if driver is on the empty end-of-day standby screen

        function updateHeader() {
            const now = new Date();
            const months = ['ian.', 'feb.', 'mar.', 'apr.', 'mai', 'iun.', 'iul.', 'aug.', 'sep.', 'oct.', 'nov.', 'dec.'];
            const day = now.getDate();
            const month = months[now.getMonth()];
            const hours = now.getHours().toString().padStart(2, '0');
            const mins = now.getMinutes().toString().padStart(2, '0');
            const text = `${day} ${month}, ${hours}:${mins}`;
            const el1 = document.getElementById('headerDate');
            const el2 = document.getElementById('headerDate2');
            if (el1) el1.textContent = text;
            if (el2) el2.textContent = text;
        }
        updateHeader();
        setInterval(updateHeader, 1000);
        function updateTheme() {

            const now = new Date();

            const currentMinutes =
                now.getHours() * 60 +
                now.getMinutes();

            const [nightHour, nightMinute] =
                settings.nightStart.split(":").map(Number);

            const [dayHour, dayMinute] =
                settings.dayStart.split(":").map(Number);

            const nightMinutes =
                nightHour * 60 + nightMinute;

            const dayMinutes =
                dayHour * 60 + dayMinute;

            const dark =
                currentMinutes >= nightMinutes ||
                currentMinutes < dayMinutes;

            document.body.classList.toggle("darkMode", dark);
        }


        window.showRouteList = function () {
            const list = document.getElementById('routeList');
            list.innerHTML = '';

            if (!masterData.routes || masterData.routes.length === 0) {
                list.innerHTML = '<div style="color:white; padding: 20px;">No routes found in Firebase. Add routes using editor.html!</div>';
            } else {
                masterData.routes.forEach(route => {
                    const btn = document.createElement('button');
                    btn.textContent = `Linia ${route.route_id}: ${route.name}`;
                    btn.onclick = () => showDepartures(route.route_id);
                    list.appendChild(btn);
                });
            }

            document.getElementById('screen1').style.display = 'flex';
            document.getElementById('screen2').style.display = 'none';
            document.getElementById('driverScreen').style.display = 'none';
        }

        window.showDepartures = function (routeId) {
            const route = masterData.routes.find(r => r.route_id === routeId);
            if (!route) return;
            const list = document.getElementById('departureList');
            list.innerHTML = '';
            document.getElementById('screen2Title').textContent = `Linia ${route.route_id}: ${route.name}`;

            // Find all trips for this route and their departures
            const routeTrips = masterData.trips.filter(t => t.route_id === routeId);
            let availableDepartures = [];

            routeTrips.forEach(trip => {
                const deps = masterData.departures.filter(d => d.trip_id === trip.trip_id);
                deps.forEach(d => {
                    availableDepartures.push({
                        departureId: d.id,
                        time: d.time,
                        trip: trip
                    });
                });
            });

            availableDepartures.sort((a, b) => a.time.localeCompare(b.time));

            availableDepartures.forEach(dep => {
                const btn = document.createElement('button');
                btn.innerHTML = `<span class="depTime">${dep.time}</span><span class="depLabel">${dep.trip.name}</span>`;
                btn.onclick = () => selectRoute(dep, routeId);
                list.appendChild(btn);
            });

            document.getElementById('screen1').style.display = 'none';
            document.getElementById('screen2').style.display = 'flex';
        }

        window.selectRoute = function (dep, routeId) {
            currentDepId = dep.departureId; // Track the current departure ID
            currentTripId = dep.trip.trip_id;
            currentDelayMin = 0;

            const trip = dep.trip;
            currentRouteName = `${trip.name} ${dep.time}`;
            currentRouteId = routeId;
            departureTime = dep.time;

            // Restore UI elements in case we are coming from the Idle Standby Screen
            const routeBox = document.querySelector('.routeBox');
            if (routeBox) routeBox.style.display = 'flex';
            const latenessDisplay = document.getElementById('latenessDisplay');
            if (latenessDisplay) latenessDisplay.style.display = 'block';

            routeStops = (trip.stop_sequence || []).map(seq => {
                const stopObj = masterData.stops.find(s => s.id === seq.stop_id);
                return {
                    id: seq.stop_id,
                    name: stopObj ? stopObj.name : 'Unknown Stop',
                    lat: stopObj ? stopObj.lat : 0,
                    lng: stopObj ? stopObj.lng : 0,
                    travelMinutes: seq.travel_minutes_from_start || 0
                };
            });

            tripTrack = [];
            totalDistance = 0;
            tripStartTime = null;
            tripDate = localDateStr();
            tripKey = `${tripDate}_${routeId}_${departureTime.replace(':', '')}`;
            tripFinished = false;
            tripWrittenOnce = false;
            lastFix = null;
            currentLateness = '0';
            stopLog = [];
            isAtStop = false;
            activeStopIndex = null;
            currentStopIndex = 0;
            isIdleStandby = false;

            document.getElementById('screen2').style.display = 'none';
            document.getElementById('driverScreen').style.display = 'flex';
            document.querySelector('.leftPanel').style.display = 'flex';
            renderStops();
            startTracking();
        }

        function localDateStr() {
            const n = new Date();
            return `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}-${String(n.getDate()).padStart(2, '0')}`;
        }

        function getStopScheduledTime(stop) {
            const [h, m] = departureTime.split(':').map(Number);
            const base = h * 60 + m;
            const travel = stop.travelMinutes || 0;
            const total = base + travel;
            const sh = Math.floor(total / 60) % 24;
            const sm = total % 60;
            return `${sh.toString().padStart(2, '0')}:${sm.toString().padStart(2, '0')}`;
        }

        function renderStops() {
            const list = document.getElementById('stopList');
            list.innerHTML = '';
            const visible = routeStops.slice(currentStopIndex, currentStopIndex + 4);
            visible.forEach((stop, i) => {
                const scheduledTime = getStopScheduledTime(stop);
                const stopName = stop.name;
                const row = document.createElement('div');
                row.className = 'stopRow' + (i === 0 ? ' nextStop' : '');
                row.innerHTML = `
                    <span class="stopIndex">${currentStopIndex + i}.</span>
                    <span class="stopName">${stopName}</span>
                    <span class="stopTime">${scheduledTime}</span>
                `;
                list.appendChild(row);
            });
            document.getElementById('routeNumber').textContent = currentRouteId;
            document.getElementById('latenessDisplay').textContent = currentLateness;
        }

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try { wakeLock = await navigator.wakeLock.request('screen'); }
                catch (err) { console.log('Wake lock failed:', err); }
            }
        }

        function startTracking() {
            if (!navigator.geolocation) return;
            if (watchId !== null) return;
            requestWakeLock();
            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    const { latitude, longitude, accuracy } = position.coords;
                    if (tripFinished || isIdleStandby) return;
                    if (accuracy > MAX_ACCURACY_M) return;
                    updateTheme();

                    const here = [latitude, longitude];
                    const timeStr = new Date().toTimeString().slice(0, 8);
                    if (!tripStartTime) tripStartTime = timeStr;

                    // Store a track point only after the bus has actually moved a bit
                    const lastPt = tripTrack[tripTrack.length - 1];
                    const moved = lastPt ? getDistance([lastPt.lat, lastPt.lng], here) : Infinity;
                    if (moved >= MIN_TRACK_STEP_M) {
                        if (lastPt) totalDistance += moved;
                        tripTrack.push({ lat: +latitude.toFixed(6), lng: +longitude.toFixed(6), t: timeStr });
                    }

                    checkStop(here, lastFix);
                    lastFix = here;
                    if (tripFinished) return; // checkStop may have just completed the trip
                    pushToFirebase(latitude, longitude);
                    renderStops();
                },
                (error) => {
                    console.error(error.message);
                    if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
                    if (error.code === error.PERMISSION_DENIED) {
                        alert('Locatia este blocata. Activeaz-o din setarile browserului.');
                        return;
                    }
                    setTimeout(() => {
                        if (routeStops.length > 0 && !tripFinished && !isIdleStandby) startTracking();
                    }, 3000);
                },
                { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 }
            );

            // periodic autosave (replaces the old no-op renderStops timer)
            if (timerInterval === null) timerInterval = setInterval(saveTrip, AUTOSAVE_MS);

            if (!visibilityListenerAdded) {
                visibilityListenerAdded = true;
                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'hidden') {
                        saveTrip(); // phone locked / app backgrounded: persist what we have
                        return;
                    }
                    requestWakeLock();
                    if (watchId === null && routeStops.length > 0 && !isIdleStandby && !tripFinished) {
                        startTracking();
                    }
                });
            }
        }

        function pushToFirebase(lat, lng) {
            if (isIdleStandby || currentStopIndex >= routeStops.length) return;
            const nextStop = routeStops[currentStopIndex];
            const scheduledTime = getStopScheduledTime(nextStop);

            const now = new Date();
            const currentMins = now.getHours() * 60 + now.getMinutes();
            const [depH, depM] = departureTime.split(':').map(Number);
            const timeUntilDeparture = (depH * 60 + depM) - currentMins;
            const shouldShowLive = timeUntilDeparture <= 5;

            set(busRef, {
                active: shouldShowLive,
                lat, lng,
                routeId: currentRouteId,
                tripId: currentTripId,
                departureId: currentDepId,
                route: currentRouteName,
                nextStop: nextStop.name,
                nextStopId: nextStop.id || null,
                delay: currentDelayMin,
                scheduledTime,
                status: currentLateness
            });
        }

        // Never wipes data: the first write of a trip uses set(), later ones use update(),
        // and `stops` is only included when there is something to store.
        // The payload is built synchronously, so callers can reset state right after calling this
        // (and must NOT await it: offline, the promise only resolves once the server acks).
        async function saveTrip() {
            if (!tripKey || tripTrack.length < 2) return;
            const data = {
                routeName: currentRouteName,
                routeId: currentRouteId,
                date: tripDate,
                departureTime,
                startTime: tripStartTime,
                endTime: new Date().toTimeString().slice(0, 8),
                distanceKm: (totalDistance / 1000).toFixed(2),
                track: [...tripTrack]
            };
            if (stopLog.length > 0) data.stops = [...stopLog];

            const write = tripWrittenOnce ? update : set;
            tripWrittenOnce = true;
            try {
                await write(ref(db, `trips/${tripKey}`), data);
            } catch (e) {
                console.error('Trip save failed:', e);
            }
        }

        // Shortest distance (metres) from point p to the segment a-b. All points are [lat, lng].
        // Lets us detect a stop even if no GPS fix landed inside its radius.
        function distToSegment(p, a, b) {
            const k = Math.cos(p[0] * Math.PI / 180);
            const toXY = q => [(q[1] - p[1]) * 111320 * k, (q[0] - p[0]) * 110540];
            const [ax, ay] = toXY(a);
            const [bx, by] = toXY(b);
            const dx = bx - ax, dy = by - ay;
            const len2 = dx * dx + dy * dy;
            let t = len2 ? -(ax * dx + ay * dy) / len2 : 0;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(ax + t * dx, ay + t * dy);
        }

        function checkStop(here, prev) {
            if (tripFinished || isIdleStandby || currentStopIndex >= routeStops.length) return;

            if (!isAtStop) {
                // Phase 1: are we entering one of the next few stops? (handles skipped stops / diversions)
                const lastIdx = Math.min(routeStops.length - 1, currentStopIndex + LOOKAHEAD_STOPS);
                for (let i = currentStopIndex; i <= lastIdx; i++) {
                    const stop = routeStops[i];
                    const target = [stop.lat, stop.lng];
                    const dist = prev ? distToSegment(target, prev, here) : getDistance(here, target);
                    if (dist > STOP_RADIUS_M) continue;

                    // stops we jumped over were never detected: record them instead of silently dropping them
                    for (let j = currentStopIndex; j < i; j++) logSkippedStop(routeStops[j]);
                    currentStopIndex = i;

                    if (i === routeStops.length - 1) {
                        // last stop: finish as soon as we touch it
                        processStopArrivalAndExit(stop);
                        handleRouteCompletion();
                    } else {
                        activeStopIndex = i;
                        isAtStop = true;
                    }
                    return;
                }
            } else {
                // Phase 2: dwelling at a stop; log it once we have LEFT the radius
                const activeStop = routeStops[activeStopIndex];
                if (!activeStop) { isAtStop = false; activeStopIndex = null; return; }

                if (getDistance(here, [activeStop.lat, activeStop.lng]) > STOP_RADIUS_M) {
                    processStopArrivalAndExit(activeStop);
                    isAtStop = false;
                    activeStopIndex = null;
                    currentStopIndex++;
                    if (currentStopIndex >= routeStops.length) handleRouteCompletion();
                }
            }
        }

        function processStopArrivalAndExit(stop) {
            const actualTime = new Date().toTimeString().slice(0, 5);
            const scheduledTime = getStopScheduledTime(stop);
            const [sh, sm] = scheduledTime.split(':').map(Number);
            const [ah, am] = actualTime.split(':').map(Number);
            let diffMins = (ah * 60 + am) - (sh * 60 + sm);
            // keep the difference sane across midnight (23:58 vs 00:02 = +4, not -1436)
            if (diffMins > 720) diffMins -= 1440;
            if (diffMins < -720) diffMins += 1440;

            currentDelayMin = diffMins;
            currentLateness = diffMins === 0 ? "0" :
                diffMins > 0 ? `+${diffMins}'` : `${diffMins}'`;

            stopLog.push({ name: stop.name, scheduled: scheduledTime, actual: actualTime, diff: diffMins });
        }

        function logSkippedStop(stop) {
            stopLog.push({ name: stop.name, scheduled: getStopScheduledTime(stop), skipped: true });
        }

        // Called once when the last stop is reached. Safe against double calls.
        function handleRouteCompletion() {
            if (tripFinished) return;
            tripFinished = true;
            stopAllTracking();   // stop GPS first so nothing else touches the trip while we wrap up

            saveTrip();          // not awaited on purpose (see saveTrip)
            set(busRef, { active: false });

            const nextDepInfo = findNextScheduledDeparture();
            if (nextDepInfo) {
                isAtStop = false;
                activeStopIndex = null;
                currentStopIndex = 0;
                selectRoute(nextDepInfo, nextDepInfo.routeId);
            } else {
                enterIdleStandbyScreen();
            }
        }

        function findNextScheduledDeparture() {
            const currentDep = masterData.departures.find(d => d.id === currentDepId);

            // Check if a next shift was explicitly set in the editor
            if (currentDep && currentDep.next_dep_id) {
                const nextDep = masterData.departures.find(d => d.id === currentDep.next_dep_id);
                if (nextDep) {
                    const nextTrip = masterData.trips.find(t => t.trip_id === nextDep.trip_id);
                    if (nextTrip) {
                        return {
                            departureId: nextDep.id,
                            time: nextDep.time,
                            trip: nextTrip,
                            routeId: nextTrip.route_id
                        };
                    }
                }
            }
            return null; // End of shift
        }

        // Displays the screen with no route number, lateness, or stops, but keeps functional controls
        function enterIdleStandbyScreen() {
            isIdleStandby = true;
            tripKey = null; // trip is already saved; nothing left to (over)write
            routeStops = [];
            currentStopIndex = 0;
            stopLog = [];
            isAtStop = false;
            activeStopIndex = null;

            // Completely hide the UI elements instead of just clearing text
            const routeBox = document.querySelector('.routeBox');
            if (routeBox) routeBox.style.display = 'none';

            const latenessDisplay = document.getElementById('latenessDisplay');
            if (latenessDisplay) latenessDisplay.style.display = 'none';

            document.getElementById('stopList').innerHTML = '<div style="color:white; padding:20px; text-align:center; font-size:18px;"></div>';

            document.querySelector('.leftPanel').style.display = 'flex';
            document.getElementById('driverScreen').style.display = 'flex';
            document.getElementById('screen1').style.display = 'none';
            document.getElementById('screen2').style.display = 'none';
        }

        function getDistance([lat1, lng1], [lat2, lng2]) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function stopAllTracking() {
            if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
            if (timerInterval !== null) { clearInterval(timerInterval); timerInterval = null; }
            if (wakeLock !== null) { wakeLock.release(); wakeLock = null; }
        }

        window.endRoute = function () {
            // On the idle standby screen the trip was already saved at the last stop: don't save again.
            const wasRunning = !tripFinished && !isIdleStandby && routeStops.length > 0;
            if (wasRunning && isAtStop && activeStopIndex !== null) {
                processStopArrivalAndExit(routeStops[activeStopIndex]);
            }
            tripFinished = true;
            stopAllTracking();
            if (wasRunning) saveTrip();
            tripKey = null;
            set(busRef, { active: false });

            routeStops = [];
            currentStopIndex = 0;
            stopLog = [];
            isAtStop = false;
            activeStopIndex = null;
            isIdleStandby = false;

            document.querySelector('.leftPanel').style.display = 'flex';
            document.getElementById('driverScreen').style.display = 'none';
            showRouteList();
        }

        window.toggleFullscreen = function () {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }

        window.addEventListener("beforeunload", () => set(busRef, { active: false }));

        // LOAD DATA FROM FIREBASE AT STARTUP
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                masterData = await loadMasterData();
                settings = masterData.settings || settings;
                showRouteList();
                updateTheme();
                setInterval(updateTheme, 60000);
            } catch (e) {
                console.error("Failed to load cloud data:", e);
                document.getElementById('routeList').innerHTML = '<div style="color:white; padding:20px;">Failed to load data from Firebase.</div>';
            }
        });
    </script>

</head>

<body>
    <div id="screen1" class="driverRouteScreen">
        <div class="driverHeader">
            <div class="headerDate" id="headerDate">--</div>
            <div class="headerStatus">✓ 3G &nbsp; ✓ GPS 1/1</div>
        </div>
        <div id="routeList" class="selectionList"></div>
    </div>
    <div id="screen2" class="driverRouteScreen" style="display:none;">
        <div class="driverHeader">
            <button class="backBtn" onclick="showRouteList()">&#8592;</button>
            <div class="headerDate" id="screen2Title">--</div>
            <div class="headerStatus">✓ 3G &nbsp; ✓ GPS 1/1</div>
        </div>
        <div id="departureList" class="selectionList"></div>
    </div>
    <div id="driverScreen" class="driverDisplay" style="display:none;">
        <div class="driverHeader">
            <div class="headerDate" id="headerDate2">--</div>
            <div class="headerStatus">✓ 3G &nbsp; ✓ GPS 1/1</div>
        </div>
        <div class="driverTop">
            <div class="leftPanel">
                <div class="routeBox">
                    <div id="routeNumber">-</div>
                </div>
                <div id="latenessDisplay" class="latenessDisplay"></div>
            </div>
            <div id="stopList" class="stopList"></div>
        </div>
        <div class="driverBottom">
            <button class="endRouteBtn" onclick="endRoute()">&#9632;</button>
            <button class="fullscreenBtn" onclick="toggleFullscreen()">&#x26F6;</button>
            <div class="plateBox">BN 29 TCB</div>
        </div>
    </div>
</body>

</html>
